name: Bug report
description: Report a reproducible problem in the engineering workbench.
title: "[Bug]: "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected behavior
      description: Include workspace, browser and the smallest circuit/specification that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include errors or a screenshot. Remove private information and credentials.
    validations:
      required: true
